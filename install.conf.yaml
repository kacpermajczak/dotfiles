- defaults:
    link:
      relink: true
      create: true

- clean: ['~']

- link:
    ~/.zprofile: .zprofile
    ~/.vimrc: .vimrc
    ~/.config/zsh: .config/zsh
    ~/.config/vim: .config/vim
    ~/.config/git: .config/git
    ~/.config/nvim: .config/nvim
    ~/.config/alacritty: .config/alacritty
    ~/.config/tmux: .config/tmux
    ~/.claude/CLAUDE.md: .config/claude/CLAUDE.md
    ~/.claude/CLAUDE.specflow.md: .config/claude/CLAUDE.specflow.md
    ~/.claude/settings.json: .config/claude/settings.json
    ~/.claude/commands: .config/claude/commands

- shell:
  - [git submodule update --init --recursive, Installing/updating submodules]
  -
    command: |
      if command -v brew >/dev/null 2>&1; then
        echo "Installing Homebrew packages from Brewfile..."
        brew bundle --file="$HOME/.dotfiles/Brewfile" --no-lock
      else
        echo "Homebrew not installed, skipping bundle installation"
        echo "Install Homebrew first: https://brew.sh"
      fi
    description: Installing Homebrew packages
    stdin: true
    stdout: true
