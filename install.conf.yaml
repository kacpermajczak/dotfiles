- defaults:
    link:
      relink: true
      create: true

- clean: ['~']

- link:
    ~/.zshenv: .zshenv
    ~/.zprofile: .zprofile
    ~/.vimrc: .config/vim/vimrc
    ~/.config/zsh: .config/zsh
    ~/.config/vim: .config/vim
    ~/.config/git: .config/git
    ~/.config/nvim: .config/nvim
    ~/.config/alacritty: .config/alacritty
    ~/.config/ghostty: .config/ghostty
    ~/.config/tmux: .config/tmux
    ~/.config/zed: .config/zed
    ~/.claude/CLAUDE.md: .config/claude/CLAUDE.md
    ~/.claude/settings.json: .config/claude/settings.json
    ~/.claude/statusline.sh: .config/claude/statusline.sh
    ~/.claude/commands: .config/claude/commands

- shell:
  - [git submodule update --init --recursive, Installing/updating submodules]
  -
    command: |
      if [ -d "$HOME/.dotfiles/homebrew-casks" ] && [ ! -d "$HOME/.dotfiles/homebrew-casks/.git" ]; then
        echo "Initializing local Homebrew tap..."
        cd "$HOME/.dotfiles/homebrew-casks"
        git init -q && git add . && git commit -q -m "Local Homebrew casks"
        echo "✓ Local Homebrew tap initialized"
      fi
    description: Initialize local Homebrew tap
    stdout: true
  -
    command: |
      if command -v brew >/dev/null 2>&1; then
        echo "Installing Homebrew packages from Brewfile..."
        brew bundle --file="$HOME/.dotfiles/Brewfile"

        # Verify critical installations
        echo ""
        echo "Verifying installations..."
        if command -v claude >/dev/null 2>&1; then
          echo "✓ Claude Code installed successfully"
        else
          echo "⚠️  Claude Code not found in PATH"
          echo "   You may need to restart your terminal"
        fi
      else
        echo "Homebrew not installed, skipping bundle installation"
        echo "Install Homebrew first: https://brew.sh"
      fi
    description: Installing Homebrew packages
    stdin: true
    stdout: true
  -
    command: |
      # Install Oh-My-Zsh if not present
      if [ ! -d "$HOME/.oh-my-zsh" ]; then
        echo "Installing Oh-My-Zsh..."
        sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
        echo "✓ Oh-My-Zsh installed"
      else
        echo "✓ Oh-My-Zsh already installed"
      fi

      # Install custom Oh-My-Zsh plugins
      ZSH_CUSTOM="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}"

      if [ ! -d "$ZSH_CUSTOM/plugins/zsh-autosuggestions" ]; then
        echo "Installing zsh-autosuggestions..."
        git clone https://github.com/zsh-users/zsh-autosuggestions "$ZSH_CUSTOM/plugins/zsh-autosuggestions"
        echo "✓ zsh-autosuggestions installed"
      else
        echo "✓ zsh-autosuggestions already installed"
      fi

      if [ ! -d "$ZSH_CUSTOM/plugins/zsh-syntax-highlighting" ]; then
        echo "Installing zsh-syntax-highlighting..."
        git clone https://github.com/zsh-users/zsh-syntax-highlighting "$ZSH_CUSTOM/plugins/zsh-syntax-highlighting"
        echo "✓ zsh-syntax-highlighting installed"
      else
        echo "✓ zsh-syntax-highlighting already installed"
      fi

      if [ ! -d "$ZSH_CUSTOM/plugins/zsh-completions" ]; then
        echo "Installing zsh-completions..."
        git clone https://github.com/zsh-users/zsh-completions "$ZSH_CUSTOM/plugins/zsh-completions"
        echo "✓ zsh-completions installed"
      else
        echo "✓ zsh-completions already installed"
      fi

      if [ ! -d "$ZSH_CUSTOM/plugins/alias-tips" ]; then
        echo "Installing alias-tips..."
        git clone https://github.com/djui/alias-tips "$ZSH_CUSTOM/plugins/alias-tips"
        echo "✓ alias-tips installed"
      else
        echo "✓ alias-tips already installed"
      fi

      if [ ! -d "$ZSH_CUSTOM/plugins/you-should-use" ]; then
        echo "Installing you-should-use..."
        git clone https://github.com/MichaelAquilina/zsh-you-should-use "$ZSH_CUSTOM/plugins/you-should-use"
        echo "✓ you-should-use installed"
      else
        echo "✓ you-should-use already installed"
      fi

      if [ ! -d "$ZSH_CUSTOM/plugins/zsh-bat" ]; then
        echo "Installing zsh-bat..."
        git clone https://github.com/fdellwing/zsh-bat "$ZSH_CUSTOM/plugins/zsh-bat"
        echo "✓ zsh-bat installed"
      else
        echo "✓ zsh-bat already installed"
      fi
    description: Installing Oh-My-Zsh and plugins
    stdin: true
    stdout: true
